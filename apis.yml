aid: culinarybrands
name: Culinarybrands
description: 'Culinary Brands is an Indian foodservice and beverage operator on a mission
  to prove that fresh, quality food is possible without compromising on taste. The company
  builds and runs a portfolio of well-known food and coffee brands across India, including
  Subway (sandwiches / QSR), Lavazza (coffee), and Fresh & Honest (coffee and vending),
  with a stated focus on sustainability, diversity and inclusion, governance, and CSR.
  Surfaced as a portfolio company of Norwest Venture Partners and profiled in the API
  Evangelist network; the public web presence is a WordPress corporate site with no
  developer portal, documentation, or product API surface at this time.'
